# Server configuration, written as nginx and converted to gofly's config.json in
# the Dockerfile (`gofly -convert`). It only uses what the converter understands:
# prefix locations, root/alias, add_header and send_timeout (no regex locations).
#
# Compression: the Dockerfile pre-compresses the text files and gofly serves the
# .gz sibling when the browser accepts gzip, so there is no on-the-fly gzip.
#
# As in nginx, a location with its own add_header does not inherit the server's
# ones, so every location repeats the cross-origin isolation headers: Python in
# the browser (PyScript workers, input(), the Stop button) needs them. Without
# them the site falls back to the mini-coi service worker, which reloads the
# first visit and proxies every request.
server {
    listen 80;
    server_name _;
    root /www;
    gzip_static on;

    # Give up on a client only after 60 s without any progress (slow classroom wifi).
    send_timeout 60s;

    # HTML pages and unversioned files (runner.py, mini-coi.js, favicon): the browser
    # keeps them but checks with the server first (a cheap 304 if unchanged), so a new
    # deployment shows up immediately.
    location / {
        add_header Cache-Control no-cache;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # Astro bundles: the file name contains a hash of its content, so it never changes.
    location /_astro/ {
        alias /www/_astro/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # PyScript, Pyodide and the Python packages (~24 MB): the path contains the
    # PyScript version, so a new version gets a new URL.
    location /vendor/ {
        alias /www/vendor/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }
}
